<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Assistant - TF-IDF Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 450px;
            height: 650px;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .chat-header {
            background: #0284c7;
            color: #ffffff;
            padding: 16px;
            text-align: center;
            font-weight: 700;
            font-size: 1.1em;
            letter-spacing: 0.5px;
        }
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95em;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user-message {
            background: #0284c7;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .bot-message {
            background: #334155;
            color: #f8fafc;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .input-area {
            display: flex;
            padding: 14px;
            border-top: 1px solid #334155;
            background: #0f172a;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #ffffff;
            border-radius: 24px;
            outline: none;
            font-size: 0.95em;
        }
        .input-area input::placeholder {
            color: #94a3b8;
        }
        .input-area button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 0 20px;
            margin-left: 10px;
            border-radius: 24px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .input-area button:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>

// --- 2. TF-IDF Engine ---

const tokenize = (text) => text.toLowerCase().replace(/[^\w\s]/g, '').split(/\s+/).filter(w => w.length > 0);

let vocab = new Set();
let df = {};
let documentCount = dataset.length;

dataset.forEach(item => {
    let tokens = tokenize(item.prompt);
    let uniqueTokens = new Set(tokens);
    uniqueTokens.forEach(token => {
        vocab.add(token);
        df[token] = (df[token] || 0) + 1;
    });
});

let idf = {};
vocab.forEach(token => {
    idf[token] = Math.log(documentCount / (df[token] || 1));
});

dataset.forEach(item => {
    let tokens = tokenize(item.prompt);
    let totalTerms = tokens.length;
    let tf = {};
    tokens.forEach(token => { tf[token] = (tf[token] || 0) + 1; });

    item.vector = {};
    vocab.forEach(token => {
        let termFreq = (tf[token] || 0) / totalTerms;
        item.vector[token] = termFreq * idf[token];
    });
});

function vectorizeInput(text) {
    let tokens = tokenize(text);
    let totalTerms = tokens.length || 1;
    let tf = {};
    tokens.forEach(token => { tf[token] = (tf[token] || 0) + 1; });

    let vector = {};
    vocab.forEach(token => {
        let termFreq = (tf[token] || 0) / totalTerms;
        vector[token] = termFreq * (idf[token] || 0);
    });
    return vector;
}

function cosineSimilarity(vec1, vec2) {
    let dotProduct = 0;
    let mag1 = 0;
    let mag2 = 0;

    vocab.forEach(token => {
        let val1 = vec1[token] || 0;
        let val2 = vec2[token] || 0;
        dotProduct += val1 * val2;
        mag1 += val1 * val1;
        mag2 += val2 * val2;
    });

    if (mag1 === 0 || mag2 === 0) return 0;
    return dotProduct / (Math.sqrt(mag1) * Math.sqrt(mag2));
}

function findBestMatch(userInput) {
    let inputVector = vectorizeInput(userInput);
    let bestMatch = null;
    let maxScore = -1;

    dataset.forEach(item => {
        let score = cosineSimilarity(inputVector, item.vector);
        if (score > maxScore) {
            maxScore = score;
            bestMatch = item;
        }
    });

    return { match: bestMatch, score: maxScore };
}

function cleanQuery(input) {
    const stopwords = [
        "search for", "search the web for", "search web for", "search the internet for", "search", 
        "look up", "google", "find information about", "find out", "find definition of", "find", 
        "play video of", "play video on", "play video trailer for", "play video", "play", "watch", 
        "show me a", "show video on", "show video highlights of", "show video", "show map for", 
        "show map location of", "show route to", "show", "directions to", "where is the", 
        "navigate to", "locate", "buy", "shop for", "order", "book flights from", "book ticket from", 
        "book plane ticket from", "book business class flights to", "book flight from", 
        "book roundtrip tickets to", "book flight", "book"
    ];

    let query = input.trim();
    for (let phrase of stopwords) {
        let regex = new RegExp("^" + phrase + "\\s+", "i");
        if (regex.test(query)) {
            query = query.replace(regex, "");
            break;
        }
    }
    return query.replace(/\s+/g, "+");
}

// --- 3. Chat Interface Logic ---

const chatMessages = document.getElementById('chat-messages');
const userInputEl = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');

function addMessage(text, sender) {
    const msgDiv = document.createElement('div');
    msgDiv.classList.add('message', sender === 'user' ? 'user-message' : 'bot-message');
    msgDiv.textContent = text;
    chatMessages.appendChild(msgDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

function processUserInput() {
    const text = userInputEl.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    userInputEl.value = '';

    const { match, score } = findBestMatch(text);

    setTimeout(() => {
        if (match && score > 0.05) {
            addMessage(match.response, 'bot');

            if (match.tag !== "conversational" && match.urlPattern) {
                let formattedQuery = cleanQuery(text);
                let targetUrl = match.urlPattern.replace("{query}", formattedQuery);
                window.open(targetUrl, '_blank');
            }
        } else {
            addMessage("I am not entirely sure how to assist with that, sir. Try asking me to search, play media, or get directions.", 'bot');
        }
    }, 400);
}

sendBtn.addEventListener('click', processUserInput);
userInputEl.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') processUserInput();
});
